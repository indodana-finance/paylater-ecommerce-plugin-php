##
# Magento Plugin Tester — multi-version environment
#
# Usage:
#   docker compose --profile m244 up -d --build   # Magento 2.4.4-p18
#   docker compose --profile m245 up -d --build   # Magento 2.4.5-p17
#   docker compose --profile m246 up -d --build   # Magento 2.4.6-p15
#   docker compose --profile m247 up -d --build   # Magento 2.4.7-p10
#   docker compose --profile m248 up -d --build   # Magento 2.4.8-p5
#   docker compose --profile all  up -d --build   # All versions
#
# After containers up, install Magento:
#   docker compose exec php-m244 install-magento.sh
#

# ─── Shared services ────────────────────────────────────────────
services:
  redis:
    image: redis:7.2-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [m244, m245, m246, m247, m248, all]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-magento}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [m244, m245, m246, m247, m248, all]
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    profiles: [m244, m245, m246, m247, m248, all]
    restart: unless-stopped

  # ─── Magento 2.4.4-p18 — PHP 8.1 + Elasticsearch 7.17 ──────
  db-m244:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-magento_root}
      MYSQL_DATABASE: magento
      MYSQL_USER: ${MYSQL_USER:-magento}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-magento}
    volumes:
      - dbdata-m244:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-magento_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [m244, all]
    restart: unless-stopped

  elasticsearch-m244:
    image: elasticsearch:7.17.24
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - esdata-m244:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [m244, all]
    restart: unless-stopped

  php-m244:
    build:
      context: ./php
      args:
        PHP_VERSION: "8.1"
    volumes:
      - magento-m244:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./plugins:/var/www/plugins:ro
    environment:
      MAGENTO_VERSION: "2.4.4-p13"
      SEARCH_ENGINE: elasticsearch7
      SEARCH_HOST: elasticsearch-m244
      SEARCH_PORT: "9200"
      DB_HOST: db-m244
      MYSQL_DATABASE: magento
      MYSQL_USER: ${MYSQL_USER:-magento}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-magento}
      RABBITMQ_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-magento}
      BASE_URL: "http://localhost:8244"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      COMPOSER_AUTH: ${COMPOSER_AUTH}
    depends_on:
      db-m244:
        condition: service_healthy
      elasticsearch-m244:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: [m244, all]
    restart: unless-stopped

  nginx-m244:
    image: nginx:1.24-alpine
    ports:
      - "8244:80"
    volumes:
      - magento-m244:/var/www/html
      - ./nginx/magento.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      PHP_FPM_HOST: php-m244
    depends_on:
      - php-m244
    profiles: [m244, all]
    restart: unless-stopped

